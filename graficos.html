<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Desvíos por Zona — CEMA</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;font-family:'Segoe UI',Arial,sans-serif;}
body{background:#f0efec;color:#1a1a1a;font-size:12px;overflow:hidden;height:100vh;}
.app{display:grid;grid-template-rows:auto auto 1fr;height:100vh;}
.hdr{background:#695F58;padding:8px 16px;display:flex;align-items:center;gap:10px;border-bottom:2px solid #BFB800;}
.hdr-title{font-size:13px;font-weight:500;letter-spacing:1px;flex:1;text-align:center;color:#fff;line-height:1.5;}
.hdr-title small{font-size:9px;color:rgba(255,255,255,0.65);display:block;}
.logo{font-size:22px;font-weight:900;letter-spacing:2px;color:#fff;}
.btn-nav{border:1px solid rgba(255,255,255,0.5);background:transparent;color:#fff;padding:4px 10px;border-radius:3px;font-size:10px;text-decoration:none;white-space:nowrap;}
.filters{background:#fff;border-bottom:2px solid #BFB800;padding:5px 12px;display:flex;gap:8px;align-items:flex-end;flex-wrap:wrap;}
.fgrp{display:flex;flex-direction:column;gap:2px;}
.fgrp label{font-size:9px;font-weight:700;text-transform:uppercase;color:#695F58;letter-spacing:0.4px;}
.fgrp select{border:1px solid #ccc;border-radius:3px;padding:3px 6px;font-size:10px;background:#fff;color:#333;min-width:110px;}
.btn-clear{border:1px solid #888;background:#fff;color:#555;padding:5px 12px;border-radius:3px;cursor:pointer;font-size:10px;align-self:flex-end;}
/* Multiselect */
.ms-wrap{position:relative;}
.ms-btn{border:1px solid #ccc;border-radius:3px;padding:3px 24px 3px 6px;font-size:10px;background:#fff;color:#333;min-width:140px;cursor:pointer;position:relative;user-select:none;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.ms-btn::after{content:"▼";position:absolute;right:6px;top:50%;transform:translateY(-50%);font-size:7px;color:#666;}
.ms-dd{display:none;position:absolute;top:calc(100% + 2px);left:0;z-index:999;background:#fff;border:1px solid #bbb;border-radius:4px;min-width:170px;box-shadow:0 6px 18px rgba(0,0,0,0.18);padding:4px 0;}
.ms-dd.open{display:block;}
.ms-dd-hdr{padding:3px 10px;font-size:9px;color:#888;border-bottom:1px solid #eee;display:flex;justify-content:space-between;}
.ms-dd-hdr span{cursor:pointer;color:#695F58;font-weight:700;}
.ms-item{display:flex;align-items:center;gap:7px;padding:5px 10px;font-size:10px;cursor:pointer;}
.ms-item:hover{background:#f5f3f0;}
.ms-item input{accent-color:#695F58;width:13px;height:13px;cursor:pointer;flex-shrink:0;}
/* Charts */
.charts-area{overflow-y:auto;padding:10px;display:grid;grid-template-columns:1fr 1fr;gap:10px;}
.zone-card{background:#fff;border:1px solid #ccc;border-radius:6px;overflow:hidden;}
.zone-header{background:#695F58;color:#fff;padding:6px 12px;font-size:11px;font-weight:600;display:flex;justify-content:space-between;align-items:center;gap:8px;}
.zone-kpis{display:flex;gap:10px;font-size:9px;flex:1;}
.kpi-v{color:#7ddb7d;font-weight:700;}
.kpi-r{color:#ff9090;font-weight:700;}
.btn-expand{background:rgba(255,255,255,0.15);border:1px solid rgba(255,255,255,0.4);color:#fff;padding:2px 8px;border-radius:3px;cursor:pointer;font-size:9px;white-space:nowrap;flex-shrink:0;}
.btn-expand:hover{background:rgba(255,255,255,0.3);}
.chart-body{padding:8px 10px 10px;}
.chart-wrap{position:relative;height:220px;}
.kpi-row{display:flex;gap:6px;margin-top:6px;}
.kpi-box{flex:1;background:#f8f6f2;border-radius:4px;padding:5px 6px;text-align:center;}
.kpi-box .val{font-size:13px;font-weight:700;}
.kpi-box .lbl{font-size:8px;text-transform:uppercase;color:#888;}
.kpi-box.verde .val{color:#27ae60;}
.kpi-box.rojo  .val{color:#e74c3c;}
.kpi-box.total .val{color:#695F58;}
/* Modal */
.modal-bg{display:none;position:fixed;inset:0;background:rgba(0,0,0,0.55);z-index:100;align-items:center;justify-content:center;}
.modal-bg.open{display:flex;}
.modal{background:#fff;border-radius:8px;overflow:hidden;width:92vw;max-width:1100px;height:82vh;display:flex;flex-direction:column;}
.modal-hdr{background:#695F58;color:#fff;padding:8px 14px;display:flex;justify-content:space-between;align-items:center;}
.modal-hdr span{font-size:13px;font-weight:600;}
.modal-close{background:none;border:1px solid rgba(255,255,255,0.5);color:#fff;padding:3px 10px;border-radius:3px;cursor:pointer;font-size:12px;}
.modal-body{flex:1;padding:14px;overflow:hidden;position:relative;}

/* NEG NOM */
.neg-nom-badge{
  position:absolute;
  background:#695F58;color:#fff;
  font-size:8px;font-weight:700;
  padding:1px 5px;border-radius:2px;
  pointer-events:none;
  white-space:nowrap;
}
.neg-nom-panel{
  background:#fff3cd;border:1px solid #f0c040;
  border-radius:4px;padding:6px 10px;
  margin-top:6px;font-size:9px;color:#695F58;
  display:none;
}
.neg-nom-panel.has-items{display:block;}
.neg-nom-panel ul{margin:3px 0 0 12px;}
.neg-nom-panel li{font-size:9px;line-height:1.6;}
</style>

<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<script>
(async function(){

// Fecha GitHub
fetch('https://api.github.com/repos/mtureo-glitch/Diagonal-pendientes/commits?path=data.json&per_page=1&t='+Date.now())
  .then(r=>r.json()).then(cs=>{
    if(cs&&cs[0]&&cs[0].commit){
      const f=new Date(cs[0].commit.author.date);
      const fs=f.toLocaleString('es-CL',{timeZone:'America/Santiago',day:'2-digit',month:'2-digit',year:'numeric',hour:'2-digit',minute:'2-digit',hour12:false});
      document.getElementById('last-update').textContent='Última actualización: '+fs+' hrs';
    }
  }).catch(()=>{});

const D = await fetch('data.json').then(r=>r.json());
const MESES_ORD=['Enero','Febrero','Marzo','Abril','Mayo','Junio','Julio','Agosto','Septiembre','Octubre','Noviembre','Diciembre'];

// Solo CEMA, VERDE(2) o ROJO(0)
// Lógica desvío gráfico (mutuamente excluyente, VERDE tiene prioridad):
// VERDE: EQUIPO ARCGIS más caro que PENDIENTE team → captura de pendiente → GANA
// ROJO:  solo si NO es VERDE: EQUIPO ACTA más caro que EQUIPO ARCGIS → PIERDE
const COSTO_EP={'SK.GRAPPLE':1,'SK.HUINCHE':1,'SK.HUINCHE MEC':1,'FW.HUINCHE':2,'ANIMALES':2,'TORRE':3};
const COSTO_ER={'SKGR':1,'SKHU':1,'FORW':1,'AMOV':1,'FOWI':2,'GRWI':2,'ANIM':2,'T500':3,'T400':3};
const COSTO_PEND={'0-35% Asist':1,'0-35% Astillador':1,'Asistido':2,'Remate':2,'Torre Mecanizada':3};

const ROWS=D.rows.filter(r=>r[11]===0).map(r=>{
  const pend=r[19]>=0?D.PEND[r[19]]:'';
  const ep  =r[6]>=0?D.EP[r[6]]:'';
  const er  =r[7]>=0?D.ER[r[7]]:'';
  const cp=COSTO_PEND[pend], ce=COSTO_EP[ep], cr=COSTO_ER[er];
  let devG=null;
  // VERDE: arcgis planificado más caro que pendiente del team → captura de pendiente
  if(cp&&ce&&ce>cp) devG=2;
  // ROJO: solo si no es VERDE → acta más caro que arcgis
  else if(ce&&cr&&cr>ce) devG=0;
  if(devG===null) return null;
  return {zona:D.Z[r[0]],predio:D.P[r[3]],tnom:D.TN[r[10]],
          mes:r[13]>=0?D.MES[r[13]]:'',pend,
          sp:r[14]>=0?D.SP[r[14]]:'',dev:devG,vol:r[12]};
}).filter(r=>r!==null);

const ZONAS=[...new Set(ROWS.map(r=>r.zona))].sort();

// Poblar selects simples
function addOpts(id,vals){
  const s=document.getElementById(id);
  vals.forEach(v=>{const o=document.createElement('option');o.value=v;o.textContent=v;s.appendChild(o);});
}
addOpts('f-mes', MESES_ORD.filter(m=>ROWS.some(r=>r.mes===m)));
addOpts('f-team', [...new Set(ROWS.map(r=>r.tnom))].sort((a,b)=>a.localeCompare(b)));
addOpts('f-sp',  [...new Set(ROWS.map(r=>r.sp).filter(Boolean))].sort());

// Bind select events
['f-mes','f-team','f-sp','f-dev'].forEach(id=>{
  document.getElementById(id).addEventListener('change', ()=>renderAll());
});
document.querySelector('.btn-clear').addEventListener('click', ()=>clearAllFilters());

// Multiselect PENDIENTE
const pendVals = [...new Set(ROWS.map(r=>r.pend).filter(Boolean))].sort();
const msItems  = document.getElementById('ms-pend-items');
pendVals.forEach(v=>{
  const div = document.createElement('div');
  div.className = 'ms-item';
  const cb = document.createElement('input');
  cb.type = 'checkbox';
  cb.value = v;
  cb.id = 'pend-cb-'+v.replace(/\W/g,'_');
  const lbl = document.createElement('label');
  lbl.htmlFor = cb.id;
  lbl.textContent = v;
  lbl.style.cursor = 'pointer';
  lbl.style.flex = '1';
  cb.addEventListener('change', ()=>{ updatePendBtn(); renderAll(); });
  div.appendChild(cb);
  div.appendChild(lbl);
  msItems.appendChild(div);
});

// Toggle dropdown
document.getElementById('ms-pend-btn').addEventListener('click', e=>{
  e.stopPropagation();
  document.getElementById('ms-pend-dd').classList.toggle('open');
});
// Cerrar al click fuera
document.addEventListener('click', e=>{
  const wrap = document.getElementById('ms-pend-wrap');
  if(!wrap.contains(e.target)) document.getElementById('ms-pend-dd').classList.remove('open');
});
// Limpiar
document.getElementById('ms-pend-clear').addEventListener('click', e=>{
  e.stopPropagation();
  document.querySelectorAll('#ms-pend-items input').forEach(c=>c.checked=false);
  updatePendBtn(); renderAll();
});

function updatePendBtn(){
  const checked=[...document.querySelectorAll('#ms-pend-items input:checked')].map(c=>c.value);
  const btn=document.getElementById('ms-pend-btn');
  btn.textContent = checked.length===0?'Todos': checked.length===1?checked[0]: checked.length+' seleccionados';
}

function getSelPends(){
  return new Set([...document.querySelectorAll('#ms-pend-items input:checked')].map(c=>c.value));
}

function clearAllFilters(){
  ['f-mes','f-team','f-sp','f-dev'].forEach(id=>document.getElementById(id).value='');
  document.querySelectorAll('#ms-pend-items input').forEach(c=>c.checked=false);
  updatePendBtn(); renderAll();
}

function getFiltered(){
  const mes  = document.getElementById('f-mes').value;
  const team = document.getElementById('f-team').value;
  const sp   = document.getElementById('f-sp').value;
  const dev  = document.getElementById('f-dev').value;
  const pends= getSelPends();
  return ROWS.filter(r=>
    (!mes  || r.mes===mes) &&
    (!team || r.tnom===team) &&
    (pends.size===0 || pends.has(r.pend)) &&
    (!sp   || r.sp===sp)
  );
}

// Helpers
const fmt=n=>n>=1e6?(n/1e6).toFixed(2)+'M':n>=1e3?(n/1e3).toFixed(1)+'K':Math.round(n).toLocaleString('es-CL');
const fmtFull=n=>Math.round(n).toLocaleString('es-CL');

// Plugin etiquetas encima de barras
const labelPlugin={
  id:'barLabels',
  afterDatasetsDraw(chart,_,opts){
    const compact=opts&&opts.compact!==false;
    const {ctx}=chart;
    ctx.save();
    // Dibujar etiquetas en TODOS los datasets con valor > 0
    chart.data.datasets.forEach((ds,di)=>{
      const isVerde=ds.backgroundColor==='#27ae60';
      const txtColor=isVerde?'#155724':'#7b0d0d';
      const fs=compact?9:11;
      const tfs=compact?8:10;
      chart.getDatasetMeta(di).data.forEach((bar,i)=>{
        const val=ds.data[i]; if(!val||val===0) return;
        // Usar teamLabels por dataset: verdeTeams o rojoTeams
        const teams=(isVerde
          ? (chart._teamLabelsV?.[i]||chart._teamLabels?.[i]||'')
          : (chart._teamLabelsR?.[i]||chart._teamLabels?.[i]||''));
        const m3str=fmt(val);
        // Fondo + m3
        ctx.font=`bold ${fs}px Segoe UI`;
        const tw=ctx.measureText(m3str).width;
        ctx.fillStyle='rgba(255,255,255,0.88)';
        ctx.fillRect(bar.x-tw/2-2, bar.y-fs-5, tw+4, fs+2);
        ctx.fillStyle=txtColor;
        ctx.textAlign='center'; ctx.textBaseline='bottom';
        ctx.fillText(m3str, bar.x, bar.y-3);
        // Team
        if(teams){
          const ml=compact?14:22;
          const tStr=teams.length>ml?teams.slice(0,ml-1)+'…':teams;
          ctx.font=`${tfs}px Segoe UI`;
          const tw2=ctx.measureText(tStr).width;
          ctx.fillStyle='rgba(255,255,255,0.88)';
          ctx.fillRect(bar.x-tw2/2-2, bar.y-fs-tfs-8, tw2+4, tfs+2);
          ctx.fillStyle='#333';
          ctx.fillText(tStr, bar.x, bar.y-fs-4);
        }
      });
    });
    ctx.restore();
  }
};
Chart.register(labelPlugin);
// Set de predios marcados como NEG.NOM
const negNomSet = new Set(JSON.parse(localStorage.getItem('negnom')||'[]'));
function saveNegNom(){ try{localStorage.setItem('negnom',JSON.stringify([...negNomSet]));}catch(e){} }

const negNomPlugin={
  id:'negNom',
  afterDatasetsDraw(chart){
    if(!chart._isRojo) return;
    const {ctx}=chart;
    ctx.save();
    chart.getDatasetMeta(0).data.forEach((bar,i)=>{
      const lbl=chart._fullLabels?.[i]||'';
      if(!negNomSet.has('negnom:'+lbl)) return;
      // Dibujar etiqueta NEG. NOM en el centro de la barra
      const text='NEG. NOM';
      const barTop=bar.y;
      const barBottom=chart.scales.y.getPixelForValue(0);
      const barMidY=(barTop+barBottom)/2;
      ctx.font='bold 9px Segoe UI';
      const tw=ctx.measureText(text).width;
      const rw=tw+12, rh=17;
      const rx=bar.x-rw/2, ry=barMidY-rh/2;
      // Fondo redondeado
      ctx.fillStyle='rgba(105,95,88,0.88)';
      ctx.beginPath();
      ctx.roundRect(rx,ry,rw,rh,4);
      ctx.fill();
      // Texto blanco centrado
      ctx.fillStyle='#fff';
      ctx.textAlign='center'; ctx.textBaseline='middle';
      ctx.fillText(text, bar.x, barMidY);
    });
    ctx.restore();
  }
};
Chart.register(negNomPlugin);

function updateNegNomPanels(){
  // Actualizar todos los charts rojos
  Object.values(chartInst).forEach(ch=>{ if(ch&&ch._isRojo) ch.update(); });
}


const chartInst={};
let modalInst=null;
const zoneCache={};

function buildChartSingle(canvas, predios, devF, compact){
  // devF: 2=VERDE, 0=ROJO
  const isV=devF===2;
  const labels =predios.map(([p])=>p.length>14?p.slice(0,12)+'…':p);
  const fullLbl=predios.map(([p])=>p);
  const teamLbl=predios.map(([,d])=>[...(isV?d.teamsV:d.teamsR)||d.teams].join(', '));
  const data   =predios.map(([,d])=>Math.round(isV?d.verde:d.rojo));
  const color  =isV?'#27ae60':'#e74c3c';
  const ch=new Chart(canvas.getContext('2d'),{
    type:'bar',
    data:{labels,datasets:[{
      label:isV?'GANA (m³)':'PIERDE (m³)',
      data, backgroundColor:color, borderRadius:3, barPercentage:0.75
    }]},
    options:{
      responsive:true, maintainAspectRatio:false,
      layout:{padding:{top:30}},
      plugins:{
        legend:{display:false},
        barLabels:{compact:true},
        tooltip:{callbacks:{
          title:items=>`${fullLbl[items[0].dataIndex]}
Team: ${teamLbl[items[0].dataIndex]}`,
          label:c=>`${c.dataset.label}: ${c.parsed.y.toLocaleString('es-CL')} m³`
        }}
      },
      scales:{
        x:{ticks:{font:{size:8},maxRotation:40,autoSkip:false},grid:{display:false}},
        y:{ticks:{font:{size:8},callback:v=>fmt(v)},grid:{color:'#f0eeeb'}}
      }
    }
  });
  ch._teamLabels=teamLbl;
  ch._teamLabelsV=teamLbl;
  ch._teamLabelsR=teamLbl;
  ch._fullLabels=fullLbl;
  ch._isRojo=!isV;
  // Click en barra roja → toggle NEG.NOM
  if(!isV){
    canvas.addEventListener('click', evt=>{
      const pts=ch.getElementsAtEventForMode(evt,'nearest',{intersect:true},false);
      if(!pts.length) return;
      const i=pts[0].index;
      const key='negnom:'+fullLbl[i];
      if(negNomSet.has(key)) negNomSet.delete(key);
      else negNomSet.add(key);
      saveNegNom();
      ch.update();
      updateNegNomPanels();
    });
  }
  return ch;
}

function buildChart(canvas, predios, devF, compact){
  const labels  = predios.map(([p])=>p.length>16?p.slice(0,14)+'…':p);
  const fullLbls= predios.map(([p])=>p);
  const teamLbls = predios.map(([,d])=>[...d.teams].join(', '));
  const teamLblsV= predios.map(([,d])=>[...(d.teamsV||d.teams)].join(', '));
  const teamLblsR= predios.map(([,d])=>[...(d.teamsR||d.teams)].join(', '));
  const dVerde = devF==='0' ? predios.map(()=>0) : predios.map(([,d])=>Math.round(d.verde));
  const dRojo  = devF==='2' ? predios.map(()=>0) : predios.map(([,d])=>Math.round(d.rojo));
  const datasets=[];
  if(devF!=='0') datasets.push({label:'GANA (m³)',   data:dVerde, backgroundColor:'#27ae60', borderRadius:3, barPercentage:0.72});
  if(devF!=='2') datasets.push({label:'PIERDE (m³)', data:dRojo,  backgroundColor:'#e74c3c', borderRadius:3, barPercentage:0.72});
  const ch=new Chart(canvas.getContext('2d'),{
    type:'bar',
    data:{labels,datasets},
    options:{
      responsive:true, maintainAspectRatio:false,
      layout:{padding:{top:compact?28:36}},
      plugins:{
        legend:{position:'top',labels:{font:{size:compact?9:11},boxWidth:10,padding:6}},
        barLabels:{compact},
        tooltip:{callbacks:{
          title:items=>`${fullLbls[items[0].dataIndex]}
Team: ${teamLbls[items[0].dataIndex]}`,
          label:c=>`${c.dataset.label}: ${c.parsed.y.toLocaleString('es-CL')} m³`
        }}
      },
      scales:{
        x:{ticks:{font:{size:compact?8:10},maxRotation:compact?35:45,autoSkip:false},grid:{display:false}},
        y:{ticks:{font:{size:compact?8:10},callback:v=>fmt(v)},grid:{color:'#f0eeeb'}}
      }
    }
  });
  ch._teamLabels =teamLbls;
  ch._teamLabelsV=teamLblsV;
  ch._teamLabelsR=teamLblsR;
  return ch;
}

function getPredios(zona, filtered, devF){
  const byP={};
  filtered.filter(r=>r.zona===zona).forEach(r=>{
    if(!byP[r.predio]) byP[r.predio]={verde:0,rojo:0,teams:new Set(),teamsV:new Set(),teamsR:new Set()};
    byP[r.predio].teams.add(r.tnom);
    if(r.dev===2){ byP[r.predio].verde+=r.vol; byP[r.predio].teamsV.add(r.tnom); }
    else          { byP[r.predio].rojo +=r.vol; byP[r.predio].teamsR.add(r.tnom); }
  });
  return Object.entries(byP).sort((a,b)=>{
    if(devF==='2') return b[1].verde-a[1].verde;
    if(devF==='0') return b[1].rojo-a[1].rojo;
    return (b[1].verde+b[1].rojo)-(a[1].verde+a[1].rojo);
  });
}

function renderAll(){
  const filtered=getFiltered();
  const devF=document.getElementById('f-dev').value;
  const area=document.getElementById('charts-area');

  ZONAS.forEach(zona=>{
    const zid=zona.replace(/[^a-z]/gi,'_');
    const allP=getPredios(zona,filtered,devF);
    const predios=allP.filter(([,d])=>{
      if(devF==='2') return d.verde>0;
      if(devF==='0') return d.rojo>0;
      return true;
    }).slice(0,15);
    const volV=predios.reduce((s,[,d])=>s+d.verde,0);
    const volR=predios.reduce((s,[,d])=>s+d.rojo,0);
    const allPredios=getPredios(zona,filtered,devF).filter(([,d])=>{
      if(devF==='2') return d.verde>0;
      if(devF==='0') return d.rojo>0;
      return true;
    });
    zoneCache[zona]={predios:allPredios, devF};

    let card=document.getElementById('card-'+zid);
    if(!card){
      card=document.createElement('div');
      card.className='zone-card'; card.id='card-'+zid;
      card.innerHTML=`
        <div class="zone-header">
          <span>Zona ${zona}</span>
          <span class="zone-kpis"><span class="kpi-v" id="kv-${zid}"></span><span class="kpi-r" id="kr-${zid}"></span></span>
          <button class="btn-expand" data-zona="${zona}">⛶ Expandir</button>
        </div>
        <div class="chart-body">
          <div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;">
            <div>
              <div style="font-size:9px;font-weight:700;color:#27ae60;text-align:center;margin-bottom:3px;">🟢 GANA</div>
              <div class="chart-wrap"><canvas id="cv-v-${zid}"></canvas></div>
              <div style="text-align:center;font-size:11px;font-weight:700;color:#27ae60;margin-top:4px;" id="kpiv-${zid}">—</div>
            </div>
            <div>
              <div style="font-size:9px;font-weight:700;color:#e74c3c;text-align:center;margin-bottom:3px;">🔴 PIERDE <span style="font-size:8px;color:#888;">(clic en barra → NEG. NOM)</span></div>
              <div class="chart-wrap"><canvas id="cv-r-${zid}"></canvas></div>
              <div style="text-align:center;font-size:11px;font-weight:700;color:#e74c3c;margin-top:4px;" id="kpir-${zid}">—</div>
            </div>
          </div>
        </div>`;
      card.querySelector('.btn-expand').addEventListener('click',()=>openModal(zona));
      area.appendChild(card);
    }

    document.getElementById('kv-'+zid).textContent='🟢 '+fmtFull(volV)+' m³';
    document.getElementById('kr-'+zid).textContent='🔴 '+fmtFull(volR)+' m³';
    document.getElementById('kpiv-'+zid).textContent=fmtFull(volV);
    document.getElementById('kpir-'+zid).textContent=fmtFull(volR);

    // Destruir charts anteriores
    if(chartInst[zid+'_v']) chartInst[zid+'_v'].destroy();
    if(chartInst[zid+'_r']) chartInst[zid+'_r'].destroy();

    // Gráfico VERDE (izquierda)
    const prediosV=allP.filter(([,d])=>d.verde>0).slice(0,12);
    const cvV=document.getElementById('cv-v-'+zid);
    if(cvV && prediosV.length>0){
      chartInst[zid+'_v']=buildChartSingle(cvV, prediosV, 2, compact=true);
    }
    // Gráfico ROJO (derecha)
    const prediosR=allP.filter(([,d])=>d.rojo>0).slice(0,12);
    const cvR=document.getElementById('cv-r-'+zid);
    if(cvR && prediosR.length>0){
      chartInst[zid+'_r']=buildChartSingle(cvR, prediosR, 0, compact=true);
    }
  });
}

// Modal
function openModal(zona){
  const {predios,devF}=zoneCache[zona];
  document.getElementById('modal-title').textContent=`Zona ${zona} — ${predios.length} predios`;
  document.getElementById('modal-bg').classList.add('open');
  if(modalInst){modalInst.destroy();modalInst=null;}
  const canvas=document.getElementById('modal-canvas');
  canvas.style.height='100%'; canvas.style.width='100%';
  // Modal: mostrar ambos en un solo gráfico agrupado
  const allForModal=predios;
  modalInst=buildChart(canvas, allForModal, devF, false);
}

document.getElementById('modal-close-btn').addEventListener('click',()=>{
  document.getElementById('modal-bg').classList.remove('open');
  if(modalInst){modalInst.destroy();modalInst=null;}
});
document.getElementById('modal-bg').addEventListener('click',e=>{
  if(e.target===document.getElementById('modal-bg')){
    document.getElementById('modal-bg').classList.remove('open');
    if(modalInst){modalInst.destroy();modalInst=null;}
  }
});

renderAll();
window.renderAll=renderAll;
window.clearAllFilters=clearAllFilters;
window.openModal=openModal;
})();
</script>
</body>
</html>
