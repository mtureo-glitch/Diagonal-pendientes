<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Desvíos por Zona — CEMA</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;font-family:'Segoe UI',Arial,sans-serif;}
body{background:#f0efec;color:#1a1a1a;font-size:12px;overflow:hidden;height:100vh;}
.app{display:grid;grid-template-rows:auto auto 1fr;height:100vh;}

.hdr{background:#695F58;padding:8px 16px;display:flex;align-items:center;gap:10px;border-bottom:2px solid #BFB800;}
.hdr-title{font-size:13px;font-weight:500;letter-spacing:1px;flex:1;text-align:center;color:#fff;line-height:1.5;}
.hdr-title small{font-size:9px;color:rgba(255,255,255,0.65);display:block;}
.logo{font-size:22px;font-weight:900;letter-spacing:2px;color:#fff;}
.btn-nav{border:1px solid rgba(255,255,255,0.5);background:transparent;color:#fff;padding:4px 10px;border-radius:3px;cursor:pointer;font-size:10px;text-decoration:none;white-space:nowrap;}

.filters{background:#fff;border-bottom:2px solid #BFB800;padding:5px 12px;display:flex;gap:8px;align-items:flex-end;flex-wrap:wrap;}
.fgrp{display:flex;flex-direction:column;gap:2px;}
.fgrp label{font-size:9px;font-weight:700;text-transform:uppercase;color:#695F58;letter-spacing:0.4px;}
.fgrp select{border:1px solid #ccc;border-radius:3px;padding:3px 6px;font-size:10px;background:#fff;color:#333;min-width:110px;}
.btn-clear{border:1px solid #888;background:#fff;color:#555;padding:5px 12px;border-radius:3px;cursor:pointer;font-size:10px;align-self:flex-end;}

.charts-area{overflow-y:auto;padding:10px;display:grid;grid-template-columns:1fr 1fr;gap:10px;}
.zone-card{background:#fff;border:1px solid #ccc;border-radius:6px;overflow:hidden;}
.zone-header{background:#695F58;color:#fff;padding:6px 12px;font-size:11px;font-weight:600;letter-spacing:0.5px;display:flex;justify-content:space-between;align-items:center;}
.zone-kpis{display:flex;gap:12px;font-size:9px;}
.kpi-v{color:#7ddb7d;font-weight:700;}
.kpi-r{color:#ff9090;font-weight:700;}
.chart-body{padding:8px 10px 10px;}
.chart-wrap{position:relative;height:220px;}

.kpi-row{display:flex;gap:6px;margin-top:6px;}
.kpi-box{flex:1;background:#f8f6f2;border-radius:4px;padding:5px 6px;text-align:center;}
.kpi-box .val{font-size:13px;font-weight:700;}
.kpi-box .lbl{font-size:8px;text-transform:uppercase;color:#888;letter-spacing:0.3px;}
.kpi-box.verde .val{color:#27ae60;}
.kpi-box.rojo  .val{color:#e74c3c;}
.kpi-box.total .val{color:#695F58;}
</style>
</head>
<body>
<div class="app">

<div class="hdr">
  <a href="index.html" class="btn-nav">← Tabla</a>
  <div class="hdr-title">
    DESVÍOS POR PREDIO — EQUIPOS CEMA
    <small id="last-update">Última actualización: 27/07/2026 00:12 hrs</small>
  </div>
  <div class="logo">arauco</div>
</div>

<div class="filters">
  <div class="fgrp"><label>MES</label><select id="f-mes" onchange="renderAll()"><option value="">Todos</option></select></div>
  <div class="fgrp"><label>TEAM</label><select id="f-team" onchange="renderAll()"><option value="">Todos</option></select></div>
  <div class="fgrp"><label>PENDIENTE</label><select id="f-pend" onchange="renderAll()"><option value="">Todos</option></select></div>
  <div class="fgrp"><label>ESTADO PLAN</label><select id="f-sp" onchange="renderAll()"><option value="">Todos</option></select></div>
  <button class="btn-clear" onclick="clearFilters()">Quitar Filtros</button>
</div>

<div class="charts-area" id="charts-area"></div>

</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<script>
(async function(){

fetch('https://api.github.com/repos/mtureo-glitch/Diagonal-pendientes/commits?path=data.json&per_page=1&t='+Date.now())
  .then(r=>r.json()).then(cs=>{
    if(cs&&cs[0]&&cs[0].commit){
      const f=new Date(cs[0].commit.author.date);
      const fs=f.toLocaleString('es-CL',{timeZone:'America/Santiago',day:'2-digit',month:'2-digit',year:'numeric',hour:'2-digit',minute:'2-digit',hour12:false});
      document.getElementById('last-update').textContent='Última actualización: '+fs+' hrs';
    }
  }).catch(()=>{});

const D = await fetch('data.json').then(r=>r.json());
const MESES_ORD=['Enero','Febrero','Marzo','Abril','Mayo','Junio','Julio','Agosto','Septiembre','Octubre','Noviembre','Diciembre'];

// Solo CEMA, VERDE(2) o ROJO(0)
const ROWS = D.rows.filter(r=>r[11]===0&&(r[8]===0||r[8]===2)).map(r=>({
  zona:  D.Z[r[0]],
  predio:D.P[r[3]],
  tnom:  D.TN[r[10]],
  mes:   r[13]>=0?D.MES[r[13]]:'',
  pend:  r[19]>=0?D.PEND[r[19]]:'',
  sp:    r[14]>=0?D.SP[r[14]]:'',
  dev:   r[8],
  vol:   r[12]
}));

const ZONAS=[...new Set(ROWS.map(r=>r.zona))].sort();

// Poblar filtros
function populate(id,vals){
  const s=document.getElementById(id);
  vals.forEach(v=>{const o=document.createElement('option');o.value=v;o.textContent=v;s.appendChild(o);});
}
populate('f-mes',MESES_ORD.filter(m=>ROWS.some(r=>r.mes===m)));
populate('f-team',[...new Set(ROWS.map(r=>r.tnom))].sort((a,b)=>a.localeCompare(b)));
populate('f-pend',[...new Set(ROWS.map(r=>r.pend).filter(Boolean))].sort());
populate('f-sp',[...new Set(ROWS.map(r=>r.sp).filter(Boolean))].sort());

function getFiltered(){
  const mes=document.getElementById('f-mes').value;
  const team=document.getElementById('f-team').value;
  const pend=document.getElementById('f-pend').value;
  const sp=document.getElementById('f-sp').value;
  return ROWS.filter(r=>
    (!mes||r.mes===mes)&&(!team||r.tnom===team)&&
    (!pend||r.pend===pend)&&(!sp||r.sp===sp));
}

function clearFilters(){
  ['f-mes','f-team','f-pend','f-sp'].forEach(id=>document.getElementById(id).value='');
  renderAll();
}

const fmt=n=>n>=1e6?(n/1e6).toFixed(2)+'M':n>=1e3?(n/1e3).toFixed(1)+'K':Math.round(n).toLocaleString('es-CL');
const fmtFull=n=>Math.round(n).toLocaleString('es-CL');
const chartInst={};

function renderAll(){
  const filtered=getFiltered();
  const area=document.getElementById('charts-area');

  ZONAS.forEach(zona=>{
    const zRows=filtered.filter(r=>r.zona===zona);
    const zid=zona.replace(/[^a-z]/gi,'_');

    // Agrupar por predio
    const byPredio={};
    zRows.forEach(r=>{
      if(!byPredio[r.predio]) byPredio[r.predio]={verde:0,rojo:0,teams:new Set()};
      byPredio[r.predio].teams.add(r.tnom);
      if(r.dev===2) byPredio[r.predio].verde+=r.vol;
      else          byPredio[r.predio].rojo +=r.vol;
    });

    // Ordenar por vol total desc, top 15
    const predios=Object.entries(byPredio)
      .sort((a,b)=>(b[1].verde+b[1].rojo)-(a[1].verde+a[1].rojo))
      .slice(0,15);

    const labels=predios.map(([p,d])=>p.length>18?p.slice(0,16)+'…':p);
    const fullLabels=predios.map(([p])=>p);
    const teamLabels=predios.map(([,d])=>[...d.teams].join(', '));
    const dataVerde=predios.map(([,d])=>Math.round(d.verde));
    const dataRojo =predios.map(([,d])=>Math.round(d.rojo));
    const volVerde=predios.reduce((s,[,d])=>s+d.verde,0);
    const volRojo =predios.reduce((s,[,d])=>s+d.rojo,0);

    // Crear card si no existe
    let card=document.getElementById('card-'+zid);
    if(!card){
      card=document.createElement('div');
      card.className='zone-card';
      card.id='card-'+zid;
      card.innerHTML=`
        <div class="zone-header">
          <span>Zona ${zona}</span>
          <span class="zone-kpis">
            <span class="kpi-v" id="kv-${zid}"></span>
            <span class="kpi-r" id="kr-${zid}"></span>
          </span>
        </div>
        <div class="chart-body">
          <div class="chart-wrap"><canvas id="cv-${zid}"></canvas></div>
          <div class="kpi-row">
            <div class="kpi-box verde"><div class="val" id="kpiv-${zid}">—</div><div class="lbl">🟢 GANA (m³)</div></div>
            <div class="kpi-box rojo"><div class="val" id="kpir-${zid}">—</div><div class="lbl">🔴 PIERDE (m³)</div></div>
            <div class="kpi-box total"><div class="val" id="kpit-${zid}">—</div><div class="lbl">TOTAL (m³)</div></div>
          </div>
        </div>`;
      area.appendChild(card);
    }

    document.getElementById('kv-'+zid).textContent='🟢 '+fmtFull(volVerde)+' m³';
    document.getElementById('kr-'+zid).textContent='🔴 '+fmtFull(volRojo)+' m³';
    document.getElementById('kpiv-'+zid).textContent=fmtFull(volVerde);
    document.getElementById('kpir-'+zid).textContent=fmtFull(volRojo);
    document.getElementById('kpit-'+zid).textContent=fmtFull(volVerde+volRojo);

    if(chartInst[zid]) chartInst[zid].destroy();

    const ctx=document.getElementById('cv-'+zid).getContext('2d');
    chartInst[zid]=new Chart(ctx,{
      type:'bar',
      data:{
        labels,
        datasets:[
          {label:'GANA (m³)',   data:dataVerde, backgroundColor:'#27ae60', borderRadius:3, barPercentage:0.75},
          {label:'PIERDE (m³)', data:dataRojo,  backgroundColor:'#e74c3c', borderRadius:3, barPercentage:0.75}
        ]
      },
      options:{
        responsive:true, maintainAspectRatio:false,
        plugins:{
          legend:{position:'top',labels:{font:{size:9},boxWidth:10,padding:6}},
          tooltip:{
            callbacks:{
              title:items=>{
                const i=items[0].dataIndex;
                return fullLabels[i]+'\nTeam: '+teamLabels[i];
              },
              label:ctx=>`${ctx.dataset.label}: ${ctx.parsed.y.toLocaleString('es-CL')} m³`
            }
          }
        },
        scales:{
          x:{
            ticks:{
              font:{size:8},
              maxRotation:40,
              callback:function(val,i){
                // Etiqueta predio + team abajo
                return [labels[i], teamLabels[i]?.length>12?teamLabels[i].slice(0,10)+'…':teamLabels[i]];
              }
            },
            grid:{display:false}
          },
          y:{ticks:{font:{size:8},callback:v=>fmt(v)},grid:{color:'#f0eeeb'}}
        }
      }
    });
  });
}

renderAll();
window.renderAll=renderAll;
window.clearFilters=clearFilters;

})();
</script>
</body>
</html>
